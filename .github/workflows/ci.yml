name: API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: overcall
          POSTGRES_USER: overcall
          POSTGRES_PASSWORD: overcall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overcall -d overcall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql://overcall:overcall@localhost:5432/overcall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pip-audit -r requirements-dev.txt
      - run: python scripts/init_test_db.py
      - run: ruff check overcall/api_schemas.py overcall/config.py overcall/deps.py overcall/errors.py overcall/logging.py overcall/main.py overcall/pagination.py overcall/v1_api.py overcall/db overcall/pricing overcall/pricing_config.py tests/conftest.py tests/contract tests/unit tests/integration tests/perf tests/security scripts
      - run: python scripts/check_legacy_dependencies.py
      - run: python scripts/check_pricing_age.py
      - run: python scripts/check_contract.py
      - run: pytest
      - run: python scripts/bench_proxy.py --requests 25

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run lint
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
